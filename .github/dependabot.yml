version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    assignees:
      - joshua-data
    commit-message:
      prefix: ci
  - package-ecosystem: terraform
    directory: /terraform
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    assignees:
      - joshua-data
    commit-message:
      prefix: deps(terraform)
